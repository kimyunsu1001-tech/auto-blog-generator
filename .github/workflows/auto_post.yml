name: Auto Blog Post

on:
  # 자동 실행(cron)은 꺼 두었습니다. 매일 글은 Claude 루틴이 작성합니다.
  # Gemini 무료 생성기를 다시 자동으로 돌리려면 아래 주석을 풀고 schedule을 추가하세요:
  #   schedule:
  #     - cron: "0 0 * * *"   # 매일 00:00 UTC = 한국시간 오전 9시
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 사용 가능

permissions:
  contents: write # 생성된 글을 저장소에 커밋하기 위해 필요

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 블로그 글 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generator.py --limit 1

      - name: 생성된 글 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "새로 생성된 글이 없습니다."
          else
            git commit -m "docs: 자동 생성 블로그 글 $(date -u +%Y-%m-%d)"
            git push
          fi
