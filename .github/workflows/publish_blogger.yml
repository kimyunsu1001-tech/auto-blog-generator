name: Publish to Blogger

on:
  push:
    branches: [main]
    paths: ["posts/**"] # posts/ 에 새 글이 push되면 자동 실행
  schedule:
    # 매일 00:30 UTC = 한국시간 09:30. push 이벤트를 놓쳤을 때를 대비한 보험.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      test_issue:
        description: "true로 실행하면 네이버·다음 안내 이슈를 시험용으로 1개 만듭니다"
        required: false
        default: "false"

permissions:
  contents: write # published.json 기록용
  issues: write # 네이버·다음 업로드용 복사 안내 이슈 생성

concurrency:
  group: publish-blogger # 동시 실행으로 인한 중복 게시 방지
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 글에 무료 일러스트 넣기 (Pixabay, 표시가 있는 글만)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python fetch_images.py
      - name: Blogger에 게시
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python publish_blogger.py --limit 3
      - name: (시험) 안내 이슈 샘플 본문 만들기
        if: ${{ github.event.inputs.test_issue == 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import publish_blogger as pb
          pb.write_issue_body(Path("posts/시험용.md"), "시험용 글", "https://example.com/test", "## 시험 본문\n\n이 이슈는 자동 생성 시험입니다. 확인 후 닫아도 됩니다.")
          PY
      - name: 네이버·다음 업로드용 안내 이슈 만들기 (새 글만)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d .issue_bodies ]; then
            for body in .issue_bodies/*.md; do
              title="$(cat "${body%.md}.title")"
              gh issue create --title "$title" --body-file "$body" --assignee "${{ github.repository_owner }}" || echo "이슈 생성 실패: $title"
            done
          fi
      - name: 게시 기록 커밋
        if: ${{ always() }} # 앞 단계가 실패해도 이미 올린 글의 기록은 남겨 중복 게시를 막는다
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json posts
          [ -d images ] && git add images || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: Blogger 게시 기록과 일러스트 업데이트"
            git pull --rebase origin main
            git push
          fi
